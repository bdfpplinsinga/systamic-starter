export_paths:
  - .prettierrc
  - CLAUDE.md
  - app/Providers/AppServiceProvider.php
  - app/Search
  - app/Widgets
  - config/statamic/assets.php
  - config/statamic/cp.php
  - config/statamic/search.php
  - config/statamic/static_caching.php
  - content/assets
  - content/collections/pages.yaml
  - content/collections/pages/home.md
  - content/collections/pages/contact.md
  - content/collections/pages/privacyverklaring.md
  - content/collections/pages/algemene-voorwaarden.md
  - content/cookie-dialog
  - content/globals
  - content/navigation
  - content/trees/collections/pages.yaml
  - content/trees/navigation
  - lang
  - public/assets/set-previews
  - resources/blueprints/assets
  - resources/blueprints/collections/pages
  - resources/blueprints/forms
  - resources/blueprints/globals
  - resources/blueprints/default.yaml
  - resources/blueprints/user.yaml
  - resources/css
  - resources/fieldsets
  - resources/forms
  - resources/js
  - resources/sites.yaml
  - resources/svg
  - resources/views/blocks
  - resources/views/components
  - resources/views/emails
  - resources/views/errors
  - resources/views/partials
  - resources/views/default.antlers.html
  - resources/views/layout.antlers.html
  - resources/views/robots.antlers.html
  - resources/views/search.antlers.html
  - resources/views/sitemap.antlers.html
  - resources/views/styleguide.antlers.html
  - resources/views/widgets
  - routes/web.php
  - package.json
  - vite.config.js
dependencies:
  emplify-software/statamic-cookie-dialog: ^3.0
  marcorieser/tailwind-merge-statamic: ^2.0
modules:
  seo:
    prompt: 'SEO Pro installeren? (betaalde addon, voegt per pagina een SEO-tab toe)'
    default: true
    dependencies:
      statamic/seo-pro: ^7.15
  news:
    prompt: 'Nieuws installeren? (collectie op /nieuws met categorieën, RSS-feed en deelknoppen)'
    default: false
    export_paths:
      - content/collections/news.yaml
      - content/collections/news
      - content/collections/pages/nieuws.md
      - content/taxonomies
      - resources/blueprints/collections/news
      - resources/blueprints/taxonomies
      - resources/views/news
  jobs:
    prompt: 'Vacatures installeren? (collectie op /vacatures met sluitingsdatum en Google for Jobs-data)'
    default: false
    export_paths:
      - app/Scopes/OpenJobs.php
      - content/collections/jobs.yaml
      - content/collections/jobs
      - content/collections/pages/vacatures.md
      - resources/blueprints/collections/jobs
      - resources/views/jobs
  services:
    prompt: 'Diensten installeren? (collectie op /diensten met icoon per dienst)'
    default: false
    export_paths:
      - content/collections/services.yaml
      - content/collections/services
      - content/collections/pages/diensten.md
      - content/trees/collections/services.yaml
      - resources/blueprints/collections/services
      - resources/views/services
  team:
    prompt: 'Team installeren? (collectie met teamleden, overzicht op /team)'
    default: false
    export_paths:
      - content/collections/team.yaml
      - content/collections/team
      - content/collections/pages/team.md
      - content/trees/collections/team.yaml
      - resources/blueprints/collections/team
      - resources/views/team
  demo:
    prompt: 'Demopagina met alle blokken en voorbeeldafbeeldingen installeren?'
    default: false
    export_paths:
      - content/collections/pages/blokken.md
      - public/assets/demo-1.jpg
      - public/assets/demo-2.jpg
      - public/assets/demo-3.jpg
      - public/assets/demo-4.jpg
      - public/assets/demo-logo-1.svg
      - public/assets/demo-logo-2.svg
      - public/assets/demo-logo-3.svg
      - public/assets/demo-logo-4.svg
      - public/assets/.meta
