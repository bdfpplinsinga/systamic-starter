{{# Eenvoudige sitemap voor als SEO Pro niet is geïnstalleerd (dat heeft een eigen sitemap). #}}
<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
{{ collection from="*" }}
    {{ if permalink }}
    <url>
        <loc>{{ permalink }}</loc>
        <lastmod>{{ updated_at format="c" }}</lastmod>
    </url>
    {{ /if }}
{{ /collection }}
</urlset>
