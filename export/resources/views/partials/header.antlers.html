<header x-data="{ open: false }" class="relative z-40 border-b border-ink/10 bg-surface">
    <x-container class="flex items-center justify-between py-5">
        <a href="/" class="font-heading text-lg font-bold">{{ site:name }}</a>

        <nav aria-label="Hoofdmenu" class="hidden lg:block">
            <ul class="flex gap-x-8">
                {{ nav:main max_depth="1" as="links" }}{{ links }}
                    <li><a href="{{ url }}" class="text-sm font-semibold {{ is_current || is_parent ? 'text-primary' : 'text-ink hover:text-primary' }}" {{ if is_current }}aria-current="page"{{ /if }}>{{ title }}</a></li>
                {{ /links }}{{ /nav:main }}
            </ul>
        </nav>

        <button type="button" x-on:click="open = !open" x-bind:aria-expanded="open" aria-controls="mobile-menu" class="-m-2 p-2 lg:hidden">
            <span class="sr-only">Menu</span>
            <span x-show="!open"><x-icon name="bars-3" size="lg" /></span>
            <span x-show="open" x-cloak><x-icon name="x-mark" size="lg" /></span>
        </button>
    </x-container>

    <nav id="mobile-menu" aria-label="Mobiel menu" x-show="open" x-collapse x-cloak class="border-t border-ink/10 lg:hidden">
        <x-container class="py-4">
            <ul class="space-y-1">
                {{ nav:main max_depth="1" as="links" }}{{ links }}
                    <li><a href="{{ url }}" class="block rounded-lg px-3 py-2 font-semibold hover:bg-surface-muted">{{ title }}</a></li>
                {{ /links }}{{ /nav:main }}
            </ul>
        </x-container>
    </nav>
</header>
