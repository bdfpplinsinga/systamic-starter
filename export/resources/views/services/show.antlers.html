<x-container class="pt-6">
    <x-breadcrumbs />
</x-container>

<x-section spacing="sm">
    <x-container width="narrow">
        {{ if icon }}
            <div class="mb-6 flex size-14 items-center justify-center rounded-full bg-accent/10 text-accent *:size-7" aria-hidden="true">{{ icon }}</div>
        {{ /if }}
        <x-heading as="h1" size="3xl">{{ title }}</x-heading>
        {{ if excerpt }}
            <p class="mt-6 text-xl text-ink-muted">{{ excerpt }}</p>
        {{ /if }}
    </x-container>
    {{ if image }}
        <x-container class="mt-10">
            <div class="aspect-video overflow-hidden rounded-2xl">
                <x-picture :image="image" cover eager sizes="(min-width: 1280px) 1280px, 100vw" />
            </div>
        </x-container>
    {{ /if }}
</x-section>

{{ partial:page_builder }}

{{ push:head }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Service",
    "name": {{ title | to_json }},
    "url": {{ permalink | to_json }}{{ if excerpt }},
    "description": {{ excerpt | to_json }}{{ /if }},
    "provider": { "@type": "Organization", "name": {{ (company:company_name ?? site:name) | to_json }} }
}
</script>
{{ /push:head }}
