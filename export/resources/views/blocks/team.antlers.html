<x-section :background="block:background" :id="block:anchor">
    <x-container>
        <x-content :block="block" />

        <ul class="mt-12 grid gap-x-8 gap-y-12 sm:grid-cols-2 lg:grid-cols-4">
            {{ block:members }}
                <li>
                    {{ if image }}
                        <div class="aspect-square overflow-hidden rounded-2xl bg-surface-muted">
                            <x-picture :image="image" cover sizes="(min-width: 1024px) 25vw, (min-width: 640px) 50vw, 100vw" alt="" />
                        </div>
                    {{ /if }}
                    <x-heading as="h3" size="sm" class="mt-5">{{ name }}</x-heading>
                    {{ if role }}<p class="text-accent">{{ role }}</p>{{ /if }}
                    {{ if bio }}<p class="mt-3 text-sm opacity-80">{{ bio }}</p>{{ /if }}

                    {{ if email || linkedin }}
                        <ul class="mt-4 flex gap-4">
                            {{ if email }}
                                <li><a href="mailto:{{ email }}" class="opacity-70 hover:opacity-100"><x-icon name="envelope" :label="'E-mail ' + name" /></a></li>
                            {{ /if }}
                            {{ if linkedin }}
                                <li><a href="{{ linkedin }}" target="_blank" rel="noopener noreferrer" class="opacity-70 hover:opacity-100"><x-icon name="linkedin" variant="socials" :label="'LinkedIn ' + name" /></a></li>
                            {{ /if }}
                        </ul>
                    {{ /if }}
                </li>
            {{ /block:members }}
        </ul>
    </x-container>
</x-section>
