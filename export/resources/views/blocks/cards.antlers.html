<x-section :background="block:background" :id="block:anchor">
    <x-container>
        <x-content :block="block" />

        <ul class="mt-12 grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
            {{ block:cards }}
                <li class="group relative flex flex-col overflow-hidden rounded-2xl bg-surface ring-1 ring-ink/10">
                    {{ if image }}
                        <div class="aspect-3/2 overflow-hidden">
                            <x-picture :image="image" cover sizes="(min-width: 1024px) 33vw, (min-width: 640px) 50vw, 100vw" class="transition-transform duration-300 group-hover:scale-105" />
                        </div>
                    {{ /if }}
                    <div class="flex grow flex-col p-6">
                        <x-heading as="h3" size="sm" class="text-ink">
                            {{ if link }}
                                {{# De link beslaat de hele kaart via ::after. #}}
                                <a href="{{ link }}" class="after:absolute after:inset-0">{{ title }}</a>
                            {{ else }}
                                {{ title }}
                            {{ /if }}
                        </x-heading>
                        {{ if description }}
                            <p class="mt-3 text-ink-muted">{{ description }}</p>
                        {{ /if }}
                    </div>
                </li>
            {{ /block:cards }}
        </ul>
    </x-container>
</x-section>
