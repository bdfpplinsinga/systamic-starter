title: 'Groep - Blokinstellingen'
fields:
  -
    handle: show_settings
    field:
      type: revealer
      display: Blokinstellingen
      mode: toggle
      input_label: 'Achtergrond en anker tonen'
      listable: false
  -
    handle: background
    field:
      type: button_group
      display: Achtergrond
      options:
        none: Geen
        muted: Licht
        primary: Primair
      default: none
      localizable: true
      width: 50
      if:
        show_settings: 'equals true'
  -
    handle: anchor
    field:
      type: text
      display: Anker-ID
      instructions: 'Maakt het blok bereikbaar via #anker-id. Alleen letters, cijfers en streepjes.'
      validate:
        - nullable
        - alpha_dash
      localizable: true
      width: 50
      if:
        show_settings: 'equals true'
