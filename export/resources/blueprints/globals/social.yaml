title: 'Social media'
tabs:
  main:
    display: 'Social media'
    sections:
      -
        instructions: 'Voeg alleen de kanalen toe die je wilt tonen. Sleep om de volgorde te wijzigen.'
        fields:
          -
            handle: social_links
            field:
              type: grid
              display: Kanalen
              mode: table
              add_row: 'Kanaal toevoegen'
              fields:
                -
                  handle: platform
                  field:
                    type: select
                    display: Platform
                    width: 33
                    validate:
                      - required
                    options:
                      linkedin: LinkedIn
                      instagram: Instagram
                      facebook: Facebook
                      x: X
                      youtube: YouTube
                      tiktok: TikTok
                      pinterest: Pinterest
                      github: GitHub
                      threads: Threads
                -
                  handle: url
                  field:
                    type: text
                    input_type: url
                    display: URL
                    width: 66
                    validate:
                      - required
                      - url
