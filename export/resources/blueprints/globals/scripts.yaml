title: Scripts
tabs:
  gtm:
    display: 'Google Tag Manager'
    sections:
      -
        instructions: 'Laadt Google Tag Manager met Consent Mode v2. Alles staat standaard op "geweigerd" en wordt per cookiecategorie vrijgegeven zodra de bezoeker toestemming geeft. Stel in GTM je tags in met de ingebouwde toestemmingscontroles.'
        fields:
          -
            handle: gtm_id
            field:
              type: text
              display: 'Container-ID'
              instructions: 'Bijvoorbeeld GTM-ABC1234. Leeg laten om GTM niet te laden.'
              placeholder: GTM-XXXXXXX
              validate:
                - nullable
                - 'regex:/^GTM-[A-Z0-9]+$/'
  main:
    display: Scripts
    sections:
      -
        instructions: 'Overige scripts van derden, zoals een chatwidget of pixel. Ze worden pas geladen als de bezoeker de bijbehorende cookiecategorie accepteert.'
        fields:
          -
            handle: scripts
            field:
              type: grid
              display: Scripts
              mode: stacked
              add_row: 'Script toevoegen'
              fields:
                -
                  handle: name
                  field:
                    type: text
                    display: Naam
                    width: 33
                    validate:
                      - required
                -
                  handle: cookie_group
                  field:
                    type: select
                    display: Cookiecategorie
                    instructions: 'Moet overeenkomen met een groep in Tools > Cookie Dialog.'
                    width: 33
                    default: statistics
                    options:
                      essential: 'Noodzakelijk (altijd laden)'
                      statistics: Statistieken
                      marketing: Marketing
                -
                  handle: position
                  field:
                    type: button_group
                    display: Plaats
                    width: 33
                    default: head
                    options:
                      head: '<head>'
                      body: 'Einde <body>'
                -
                  handle: code
                  field:
                    type: code
                    display: Code
                    mode: htmlmixed
                    validate:
                      - required
