title: Bericht
tabs:
  main:
    display: Inhoud
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              localizable: true
              validate:
                - required
          -
            handle: excerpt
            field:
              type: textarea
              display: Samenvatting
              instructions: 'Korte intro, ook gebruikt in overzichten.'
              character_limit: 200
              localizable: true
              listable: false
          -
            import: image
          -
            import: page_builder
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              display: Datum
              required: true
              validate:
                - required
          -
            handle: categorie
            field:
              type: terms
              display: Categorieën
              taxonomies:
                - categorie
              mode: select
              create: true
              localizable: true
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta description'
              instructions: 'Wordt gebruikt als SEO Pro niet is geïnstalleerd.'
              character_limit: 160
              localizable: true
              listable: false
